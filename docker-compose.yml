services:
  api:
    image: ${DOCKER_IMAGE:-softvence/mehdi-ai:latest}
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: sqlite:///./data/rag.db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-project_documents}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-base-en-v1.5}
      HYBRID_CANDIDATE_MULTIPLIER: ${HYBRID_CANDIDATE_MULTIPLIER:-4}
      KEYWORD_SCAN_LIMIT: ${KEYWORD_SCAN_LIMIT:-500}
    depends_on:
      - qdrant
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
